[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "Personal AI assistant built from primitives (Anthropic SDK tool-use loop)"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
# Only the assistant package is installable code; config/, data/, tests/ are not packages.
include = ["assistant*"]
